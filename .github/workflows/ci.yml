name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Shellcheck bash scripts
        run: shellcheck -x install.sh tests/*.sh tests/helpers/*.sh

      # Pinned by version and checksum so a formatting run never changes
      # underneath us and turns a green lint job red on an unrelated PR.
      - name: Install shfmt
        env:
          SHFMT_VERSION: v3.14.1
          SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
        run: |
          curl -fsSL -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/$SHFMT_VERSION/shfmt_${SHFMT_VERSION}_linux_amd64"
          echo "$SHFMT_SHA256  /tmp/shfmt" | sha256sum --check --strict
          chmod +x /tmp/shfmt
          sudo mv /tmp/shfmt /usr/local/bin/shfmt
          shfmt --version

      - name: Check bash formatting
        run: shfmt -d -i 2 -ci install.sh tests/*.sh tests/helpers/*.sh

      - name: Check bash syntax
        run: |
          for file in install.sh tests/*.sh tests/helpers/*.sh; do
            echo "bash -n $file"
            bash -n "$file"
          done

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install zsh
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      # The suite parses every zsh script, sources the profile in a throwaway
      # $HOME, and exercises install.sh against stub commands.
      - name: Run tests
        run: ./tests/run.sh

  install:
    name: Run install.sh
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The dependency-free test suite checks the Brewfiles by hand because it
      # has to run without Homebrew. Here Homebrew is present, so let it parse
      # them for real; `list` resolves every entry without installing anything.
      - name: Parse the Brewfiles with brew bundle
        run: |
          for brewfile in Brewfile Brewfile.*; do
            echo "brew bundle list --all --file=$brewfile"
            brew bundle list --all --file="$brewfile"
          done

      - name: Run install.sh against a sandbox home
        run: |
          sandbox="$(mktemp -d)"
          echo "HOME_SANDBOX=$sandbox" >>"$GITHUB_ENV"
          # CI is set by GitHub Actions, which puts install.sh in
          # non-interactive mode and skips the optional dependency prompts.
          HOME="$sandbox" ./install.sh
          # Re-run it: installing over the links left by the first run must
          # repoint them, not nest a second link inside the checkout.
          HOME="$sandbox" ./install.sh

      - name: Verify installed files
        run: |
          # install.sh links into the checkout, so these must be symlinks
          # pointing at this working copy rather than copies of it.
          for link in scripts .zshrc; do
            target="$(readlink "$HOME_SANDBOX/$link")" ||
              { echo "~/$link is not a symlink"; exit 1; }
            [ "$target" = "$PWD/$link" ] ||
              { echo "~/$link -> $target, expected $PWD/$link"; exit 1; }
          done
          [ ! -e "$HOME_SANDBOX/scripts/scripts" ] ||
            { echo "a re-run nested a link inside scripts/"; exit 1; }
          # oh-my-zsh is cloned, not linked, and the second run above must
          # have left the first run's clone alone.
          [ -f "$HOME_SANDBOX/.oh-my-zsh/oh-my-zsh.sh" ] ||
            { echo "oh-my-zsh was not installed"; exit 1; }
          # diff follows the symlinks it is handed, so this compares contents.
          diff -r scripts "$HOME_SANDBOX/scripts"
          diff .zshrc "$HOME_SANDBOX/.zshrc"
