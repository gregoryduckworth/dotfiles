name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Shellcheck bash scripts
        run: shellcheck -x install.sh update.sh tests/*.sh tests/helpers/*.sh

      - name: Check bash syntax
        run: |
          for file in install.sh update.sh tests/*.sh tests/helpers/*.sh; do
            echo "bash -n $file"
            bash -n "$file"
          done

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install zsh
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      # The suite parses every zsh script, sources the profile in a throwaway
      # $HOME, and exercises install.sh and update.sh against stub commands.
      - name: Run tests
        run: ./tests/run.sh

  install:
    name: Run install.sh
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run install.sh against a sandbox home
        run: |
          sandbox="$(mktemp -d)"
          echo "HOME_SANDBOX=$sandbox" >>"$GITHUB_ENV"
          # CI is set by GitHub Actions, which puts install.sh in
          # non-interactive mode and skips the optional dependency prompts.
          HOME="$sandbox" ./install.sh

      - name: Verify installed files
        run: |
          diff -r scripts "$HOME_SANDBOX/scripts"
          diff .zshrc "$HOME_SANDBOX/.zshrc"
