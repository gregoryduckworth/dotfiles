name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Shellcheck bash scripts
        run: shellcheck -x install.sh update.sh tests/*.sh tests/helpers/*.sh

      # Pinned by version and checksum so a formatting run never changes
      # underneath us and turns a green lint job red on an unrelated PR.
      - name: Install shfmt
        env:
          SHFMT_VERSION: v3.14.1
          SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
        run: |
          curl -fsSL -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/$SHFMT_VERSION/shfmt_${SHFMT_VERSION}_linux_amd64"
          echo "$SHFMT_SHA256  /tmp/shfmt" | sha256sum --check --strict
          chmod +x /tmp/shfmt
          sudo mv /tmp/shfmt /usr/local/bin/shfmt
          shfmt --version

      - name: Check bash formatting
        run: shfmt -d -i 2 -ci install.sh update.sh tests/*.sh tests/helpers/*.sh

      - name: Check bash syntax
        run: |
          for file in install.sh update.sh tests/*.sh tests/helpers/*.sh; do
            echo "bash -n $file"
            bash -n "$file"
          done

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install zsh
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      # The suite parses every zsh script, sources the profile in a throwaway
      # $HOME, and exercises install.sh and update.sh against stub commands.
      - name: Run tests
        run: ./tests/run.sh

  install:
    name: Run install.sh
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run install.sh against a sandbox home
        run: |
          sandbox="$(mktemp -d)"
          echo "HOME_SANDBOX=$sandbox" >>"$GITHUB_ENV"
          # CI is set by GitHub Actions, which puts install.sh in
          # non-interactive mode and skips the optional dependency prompts.
          HOME="$sandbox" ./install.sh

      - name: Verify installed files
        run: |
          diff -r scripts "$HOME_SANDBOX/scripts"
          diff .zshrc "$HOME_SANDBOX/.zshrc"
